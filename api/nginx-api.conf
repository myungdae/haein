# =============================================
# 강해인 怡娜 - Nginx API 프록시 설정
#
# 적용 방법:
#   sudo cp nginx-api.conf /etc/nginx/conf.d/haein-api.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
# =============================================

# haein.exko.kr 서버 블록에 아래 location 블록을 추가하세요
# (기존 server 블록 안에 삽입)

# 만약 기존 설정 파일 위치를 모르시면:
#   sudo nginx -T | grep "server_name haein"

location /api/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;

    # CORS preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "https://haein.exko.kr";
        add_header Access-Control-Allow-Methods "POST, GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Content-Length 0;
        return 204;
    }
}
