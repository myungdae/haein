<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>강해인 홈페이지 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="admin-shell">
    <section id="loginView" class="login-view" hidden>
      <div class="login-card">
        <div class="brand-mark">怡娜</div>
        <h1>홈페이지 관리</h1>
        <p>강해인 홈페이지의 내용을 직접 수정할 수 있습니다.</p>
        <form id="loginForm">
          <label>아이디<input name="username" autocomplete="username" required /></label>
          <label>비밀번호<input type="password" name="password" autocomplete="current-password" required /></label>
          <button class="primary" type="submit">로그인</button>
          <p id="loginMessage" class="message" role="alert"></p>
        </form>
      </div>
    </section>

    <section id="cmsView" hidden>
      <header class="topbar">
        <div><strong>강해인 CMS</strong><span>홈페이지 관리</span></div>
        <button id="logoutButton" class="text-button">로그아웃</button>
      </header>

      <div id="menuView">
        <div class="welcome">
          <h1>무엇을 수정할까요?</h1>
          <p>내용을 선택한 뒤 미리보기에서 확인하고 공개하세요.</p>
        </div>
        <nav class="menu-grid" aria-label="관리 메뉴">
          <button class="menu-card" data-section="profile"><span>👤</span><strong>내 소개</strong><small>사진, 소개, 현재 활동</small></button>
          <button class="menu-card" data-section="hero"><span>🏠</span><strong>메인 화면</strong><small>첫 화면의 대표 문구</small></button>
          <button class="menu-card" data-section="class"><span>🎤</span><strong>시낭송교실</strong><small>수업 소개와 핵심 정보</small></button>
          <button class="menu-card" data-section="contact"><span>☎️</span><strong>연락처</strong><small>전화, 이메일, SNS</small></button>
          <a class="menu-card" href="gallery-upload.html"><span>🖼️</span><strong>갤러리</strong><small>사진 업로드와 관리</small></a>
        </nav>
        <div class="future-box"><strong>추후 추가 예정</strong><p>경력/수상 · 시/작품 · 공연 · MC / Presenter · 소식</p></div>
      </div>

      <div id="editorView" hidden>
        <div class="editor-heading">
          <button id="backButton" class="back-button" type="button">← 메뉴</button>
          <div><h1 id="editorTitle"></h1><p>현재 홈페이지 내용을 확인하고 수정하세요.</p></div>
        </div>
        <form id="contentForm">
          <div id="fields"></div>
          <div class="sticky-actions">
            <button id="previewButton" class="secondary" type="button">미리보기</button>
            <button class="primary" type="submit">저장 및 공개</button>
          </div>
          <p id="saveMessage" class="message" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <dialog id="previewDialog">
    <div class="dialog-head"><strong>공개 전 미리보기</strong><button id="closePreview" aria-label="닫기">×</button></div>
    <div id="previewContent" class="preview-content"></div>
    <div class="dialog-actions"><button id="previewCancel" class="secondary">다시 수정</button><button id="previewPublish" class="primary">확인하고 공개</button></div>
  </dialog>
  <script src="login-handler.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
